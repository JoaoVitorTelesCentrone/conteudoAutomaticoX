name: X automatico

on:
  schedule:
    - cron: '17 6,7 * * *'
      timezone: America/Sao_Paulo
    - cron: '17,47 8-22 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      operation:
        description: Escolha gerar ou publicar
        required: true
        type: choice
        options:
          - generate
          - publish

permissions:
  contents: write

concurrency:
  group: x-automatico
  cancel-in-progress: false

jobs:
  x:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      AUTOMATION_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dados de fuso horario
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from zoneinfo import ZoneInfo; print(ZoneInfo('America/Sao_Paulo'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar ou publicar
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $operation = $env:MANUAL_OPERATION
          } elseif ($env:EVENT_SCHEDULE -eq '17 6,7 * * *') {
            $operation = 'generate'
          } else {
            $operation = 'publish'
          }
          python .\github_x.py $operation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
